# Image builds run on release tags only.
default:
  tags: ["docker-in-docker:amd64"]
  image: registry.ddbuild.io/images/nydus:v2.3.7

variables:
  BASE_IMAGE: "registry.ddbuild.io/images/base/gbi-distroless-root:release"

stages:
  - build

build_provider:
  stage: build
  variables:
    KUBERNETES_CPU_REQUEST: "8"
    KUBERNETES_CPU_LIMIT: "16"
    KUBERNETES_MEMORY_REQUEST: "24Gi"
    KUBERNETES_MEMORY_LIMIT: "32Gi"
  id_tokens:
    DDSIGN_ID_TOKEN:
      aud: image-integrity
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apt-get update && apt-get install -y make git wget
    - git config --global url."https://oauth2:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
    - wget https://go.dev/dl/go1.27.3.linux-amd64.tar.gz
    - tar -C /usr/local -xzf go1.27.3.linux-amd64.tar.gz
    - export PATH=/usr/local/go/bin:$PATH
    - export GOTOOLCHAIN=local
    - go version
    - git submodule update --init --recursive
  script:
    - |
      set -euxo pipefail
      export PATH=/usr/local/go/bin:$PATH
      export GOTOOLCHAIN=local
      export GOFIPS140=v1.0.0
      export PLATFORMS="linux_amd64 linux_arm64"
      export BATCH_PLATFORMS=linux_amd64,linux_arm64
      VERSION="$CI_COMMIT_TAG"
      REG="registry.ddbuild.io"
      SUBPACKAGES="config authorization storage"

      echo "Building provider-upjet-azure:${VERSION}"
      echo "Registry: ${REG}"
      echo "Base image: ${BASE_IMAGE}"

      # Preserve the Azure runtime defaults in the custom Dockerfile.
      cat > /tmp/Dockerfile.provider << EOF
      FROM ${BASE_IMAGE}

      ARG TARGETOS
      ARG TARGETARCH
      ARG CROSSPLANE_PROVIDER_VERSION

      ENV USER_ID=65532
      ENV ARM_PARTNER_ID=a9cee75d-8f11-42e4-bc19-953757f4ea3c
      ENV ARM_DISABLE_TERRAFORM_PARTNER_ID=true
      ENV AZURE_HTTP_USER_AGENT="crossplane-provider-upjet-azure/\${CROSSPLANE_PROVIDER_VERSION} (\${TARGETARCH}-\${TARGETOS})"

      USER \${USER_ID}
      EXPOSE 8080

      ENTRYPOINT ["provider"]
      EOF

      # Build runnable Crossplane packages using the existing make system.
      BUILD_ARGS="--file /tmp/Dockerfile.provider --label target=staging" \
      XPKG_REG_ORGS_NO_PROMOTE="" \
      XPKG_REG_ORGS="$REG" \
      REGISTRY_ORGS="$REG" \
      CONFIG_DEPENDENCY_REG_ORG="$REG" \
      VERSION="$VERSION" \
      make build.all publish BRANCH_NAME=main SUBPACKAGES="${SUBPACKAGES}"

      # Sign each published image by immutable digest.
      for SUBPKG in ${SUBPACKAGES}; do
        if [ "$SUBPKG" = "config" ]; then
          IMAGE_NAME="provider-family-azure"
        else
          IMAGE_NAME="provider-azure-${SUBPKG}"
        fi
        DIGEST=$(crane digest "${REG}/${IMAGE_NAME}:${VERSION}")
        ddsign sign "${REG}/${IMAGE_NAME}:${VERSION}@${DIGEST}"
      done
